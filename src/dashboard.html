<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT - ESP32 + Mosquitto</title>
  <!-- Biblioteca Paho MQTT via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
 
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <header>
        <div id="logo">
            <div id="icone"></div>
        </div>

        <nav id="menu">
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="dashboard.html">dashboard</a></li>
                <li><a href="sobreProjeto.html">sobre</a></li>
            </ul>
        </nav>
    </header>


<main>  
    <div class="tudo">
        <h1>Monitoramento IoT em Tempo Real</h1>
        <div class="alinhamento"> 

            
            <div id="status" class="status disconnected">Status: Desconectado</div>
        </div>
      
        <div class="cards-container">
          <div class="card">
            <h3>Temperatura</h3>
            <div class="value"><span id="temp">--</span> <span class="unit">°C</span></div>
          </div>
      
          <div class="card">
            <h3>Umidade</h3>
            <div class="value"><span id="hum">--</span> <span class="unit">%</span></div>
          </div>
      
          <div class="card">
            <h3>Qualidade do Ar</h3>
            <div class="value"><span id="air">--</span></div>
          </div>
        </div>

    </div>
</main>

  
  <script src="../index.js"></script>
</body>
</html>
